<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="How it works: public sources are collected, normalized onto one schema, deduplicated, mapped to OWASP, NIST and MITRE ATLAS taxonomies, validated, then shipped as a website, JSON, PyPI, Hugging Face, STIX/TAXII and MISP" font-family="Inter,Segoe UI,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker></defs><rect width="1200" height="500" rx="16" fill="#ffffff" stroke="#e7e5e4"/><text x="40" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#c2410c">01</text><text x="62" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#78716c">COLLECT</text><text x="452" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#c2410c">02</text><text x="474" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#78716c">NORMALIZE</text><text x="866" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#c2410c">03</text><text x="888" y="52" font-size="12" font-weight="700" letter-spacing="2" fill="#78716c">SHIP</text><rect x="40" y="72" width="290" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="95" font-size="14.5" font-weight="650" fill="#1c1917">AI Incident Database</text><text x="56" y="113" font-size="12" fill="#78716c">official weekly snapshot</text><rect x="40" y="132" width="290" height="42" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="158" font-size="14.5" font-weight="650" fill="#1c1917">OECD AI Incidents Monitor</text><rect x="40" y="182" width="290" height="42" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="208" font-size="14.5" font-weight="650" fill="#1c1917">AIAAIC Repository</text><rect x="40" y="232" width="290" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="255" font-size="14.5" font-weight="650" fill="#1c1917">MITRE ATLAS</text><text x="56" y="273" font-size="12" fill="#78716c">case studies</text><rect x="40" y="292" width="290" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="315" font-size="14.5" font-weight="650" fill="#1c1917">NVD · GHSA · OSV · CISA KEV</text><text x="56" y="333" font-size="12" fill="#78716c">AI/ML CVEs</text><rect x="40" y="352" width="290" height="42" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="378" font-size="14.5" font-weight="650" fill="#1c1917">AVID · garak · promptfoo</text><rect x="40" y="402" width="290" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="56" y="425" font-size="14.5" font-weight="650" fill="#1c1917">Researcher &amp; vendor reports</text><text x="56" y="443" font-size="12" fill="#78716c">blogs, threat reports, papers</text><rect x="452" y="80" width="296" height="56" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="468" y="105" font-size="14.5" font-weight="650" fill="#1c1917">Ingest</text><text x="468" y="123" font-size="12" fill="#78716c">per-source parsers, polite conduct</text><path d="M600 136 v14" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/><rect x="452" y="154" width="296" height="56" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="468" y="179" font-size="14.5" font-weight="650" fill="#1c1917">Normalize</text><text x="468" y="197" font-size="12" fill="#78716c">one schema for every source</text><path d="M600 210 v14" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/><rect x="452" y="228" width="296" height="56" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="468" y="253" font-size="14.5" font-weight="650" fill="#1c1917">Merge &amp; dedupe</text><text x="468" y="271" font-size="12" fill="#78716c">CVE · source ID · URL · title</text><path d="M600 284 v14" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/><rect x="452" y="302" width="296" height="56" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="468" y="327" font-size="14.5" font-weight="650" fill="#1c1917">Map taxonomies</text><text x="468" y="345" font-size="12" fill="#78716c">OWASP LLM · ASI · NIST · ATLAS</text><path d="M600 358 v14" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/><rect x="452" y="376" width="296" height="56" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="468" y="401" font-size="14.5" font-weight="650" fill="#1c1917">Validate</text><text x="468" y="419" font-size="12" fill="#78716c">JSON Schema + CI drift gates</text><text x="600" y="456" text-anchor="middle" font-size="12" fill="#78716c">deterministic build · no model calls</text><text x="600" y="474" text-anchor="middle" font-size="12" fill="#78716c">stable IDs · tombstones, never deletions</text><rect x="866" y="72" width="294" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="882" y="95" font-size="14.5" font-weight="650" fill="#1c1917">Searchable website</text><text x="882" y="113" font-size="12" fill="#78716c">filter · search · deep-link</text><rect x="866" y="132" width="294" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="882" y="155" font-size="14.5" font-weight="650" fill="#1c1917">JSON + JSON Schema</text><text x="882" y="173" font-size="12" fill="#78716c">data/incidents.json</text><rect x="866" y="192" width="294" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="882" y="215" font-size="14.5" font-weight="650" fill="#1c1917">PyPI package</text><text x="882" y="233" font-size="12" fill="#78716c">pip install genai-incidents</text><rect x="866" y="252" width="294" height="52" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/><text x="882" y="275" font-size="14.5" font-weight="650" fill="#1c1917">Hugging Face dataset</text><text