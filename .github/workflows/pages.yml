name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/incidents.min.json"
      - "data/incidents.json"
      - "scripts/export_stix.py"
      - "scripts/export_taxii.py"
      - "scripts/export_misp.py"
      - "scripts/gen_docs_core_data.py"
      - "scripts/gen_data_integrity.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Mirror data file into docs/data/
        run: |
          mkdir -p docs/data
          cp data/incidents.min.json docs/data/incidents.min.json
      - name: Split into a trimmed core payload + lazy per-year detail shards (WS6-T5, scale)
        run: python scripts/gen_docs_core_data.py
      - name: Publish SHA-256 checksums for every served data file (WS6-T5, integrity)
        run: python scripts/gen_data_integrity.py
      - name: Generate STIX 2.1 bundle for download
        run: python scripts/export_stix.py
      - name: Generate static TAXII-compatible discovery document
        run: python scripts/export_taxii.py
      - name: Generate MISP feed
        run: python scripts/export_misp.py
      - name: Generate Open Graph social card
        run: |
          pip install --quiet pillow
          python scripts/make_og_image.py
      - uses: actions/configure-pages@v5
      # Custom Jekyll build instead of actions/jekyll-build-pages: the managed
      # action pins the github-pages metagem whose jekyll-relative-links plugin
      # rewrites links across every page and took 400+ s at ~9k incident pages,
      # so the build no longer finished at 12k+. Our docs/Gemfile pulls only
      # Jekyll core + minima (no relative-links / optional-front-matter /
      # readme-index / titles-from-headings / …), so the build scales.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build site with Jekyll
        # The Gemfile lives in docs/; point bundler at it while keeping the
        # source/destination paths repo-root-relative.
        run: bundle exec jekyll build --source docs --destination ./_site --trace
        env:
          JEKYLL_ENV: production
          BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
