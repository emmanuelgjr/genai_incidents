name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/genai-incidents/
    permissions:
      id-token: write   # trusted publishing — no API tokens
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: pip install --upgrade build
      - name: Stamp the package data with build_manifest.json (v2.13.0 item 8)
        # commit + committer-date built_at + counts from data/stats.json. The
        # file is gitignored; pyproject's [tool.hatch.build] artifacts ships it.
        run: python scripts/export_integrity.py manifest --out src/genai_incidents/data/build_manifest.json
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish to PyPI
        # v1.14.0's bundled twine rejects `Metadata-Version: 2.5`, which current
        # setuptools emits — it failed the v2.10.0 release with
        # `InvalidDistribution: '2.5' is not a valid metadata version` AFTER the
        # GitHub Release was already published, so the tag existed with no PyPI
        # artifact behind it. Pinned to the newest release by commit SHA rather
        # than by tag, keeping this repo's supply-chain convention.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Uses PyPI trusted-publishing (OIDC). Configure once in PyPI:
          # Account settings -> Publishing -> Add a new pending publisher.
          packages-dir: dist/
