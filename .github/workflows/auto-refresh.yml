name: Weekly auto-refresh

on:
  schedule:
    # Sundays at 04:00 UTC. Adjust if you'd prefer a different cadence.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      oecd_aim_limit:
        description: "Max OECD AIM pages to fetch (0 = all)"
        default: "3000"
      accept_aiaaic_yield_drop:
        description: "Accept an AIAAIC yield drop below 90% of the committed rows for this run (maintainer override; logged loudly)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Never let a scheduled run and a manual dispatch (or two schedules) race on the
# shared auto-refresh/data branch. Queue them instead of cancelling so a run is
# never interrupted mid-commit.
concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  # WS4-T2 / v2.13.0 item 3: a CVE rejected after it was ingested must be
  # retracted, not left live. Feeder = NVD CVEs modified in the last 10 days (a
  # rejection is a modification); the rotation budget re-checks the stalest ids.
  #
  # WHY A SEPARATE JOB (BOUNCE #1, docs/audits/rejected-cve-sweep-gap-2026-10-09.md
  # addendum 2026-10-09b): the OECD step alone takes 25-51 min and the refresh
  # job's limit was 60 (100 since D142), so a sweep step inside it could be cancelled with the
  # job -- losing the health-counter persistence, the re-merge, the tests, the
  # PR and the sweep's own snapshot. Here the sweep has its own 60-minute
  # limit; it is capped by wall clock (--max-seconds 2400) so it stops cleanly
  # and writes its snapshot and log; and its output reaches the refresh job as
  # an artifact uploaded with `if: always()`.
  #
  # Throughput: --max-requests 1200 at about 1.07 s/request measured (1 req/s
  # floor in ingest/common.py) = about 21 min; 2400 s allows 1,200 requests even
  # at 2.0 s/request. Every corpus CVE is re-checked within ceil(N/1200) weeks
  # (9,169 ids = 8 weeks; 16 at the old budget of 600). Never-checked ids and
  # records that predate dispute detection sort first. The step also records
  # DISPUTED CVEs and writes the dated log docs/audits/cve-sweep/<date>.{md,json};
  # it exits non-zero when more than 10% of the fetches fail (continue-on-error:
  # the PR is not blocked, the outcome is shown in the summary).
  cve-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The sweep only reads the repo; the artifact upload uses the runner's
    # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so no write scope is needed.
    permissions:
      contents: read
    # The sweep step is continue-on-error (the PR must not be blocked), which
    # makes this job's own `result` always `success`. Expose the STEP outcome
    # so the refresh job's summary can show a >10% fail rate, a crash or the
    # backstop as a failure.
    outputs:
      sweep_outcome: ${{ steps.ingest_cve_rejections.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh CVE rejection snapshot
        id: ingest_cve_rejections
        timeout-minutes: 45
        run: python scripts/ingest_cve_rejections.py --nvd-modified-days 10 --max-requests 1200 --max-seconds 2400
        continue-on-error: true

      - name: Collect sweep output
        if: always()
        run: |
          mkdir -p sweep-out
          cp ingest/cve_rejections.json sweep-out/ 2>/dev/null || true
          cp docs/audits/cve-sweep/"$(date -u +%F)".* sweep-out/ 2>/dev/null || true
          ls -la sweep-out

      - name: Upload sweep output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-sweep-output
          path: sweep-out
          if-no-files-found: warn
          # 14 days, not 3: the artifact is the only copy of the sweep's snapshot
          # until the refresh job's PR carries it, and a refresh run that fails
          # (or is waiting on a re-run) must not lose it. The sweep job has
          # contents: read, so carrying it by a repo write here would widen its
          # scope for no gain.
          retention-days: 14

  # D146-1 (2026-10-29): the OECD fetch runs in its OWN job so the refresh job is
  # neither blocked nor bounded by it. The fetch takes about 51 min (3000 pages at
  # the 1 req/s floor) and, under D114, its bytes never reach the merge: the OECD
  # inputs are held at their committed versions. What the fetch still feeds is
  # (1) the D42 review artifact, (2) the skip-rule sampling probe and its
  # rotation cursor, and (3) the source-health counter's `oecd_aim` outcome.
  # This job owns (1) and (2) and hands (3) and the cursor to the `finalize`
  # job, the single writer of the `refresh-state` branch. The refresh job does
  # NOT list this job in `needs:`.
  #
  # Failure semantics are as before: the fetch step is continue-on-error and its
  # step outcome (not the job result, which would hide it) is the job output the
  # health counter reads; a probe violation fails THIS job loudly on the first
  # occurrence (last step), without touching the refresh PR.
  oecd-fetch:
    runs-on: ubuntu-latest
    # Step cap 65 (D142: measured 50.8 min, 1.3x) + ~3 min of other steps = 68;
    # 80 leaves the post-fetch steps (probe check, stash, uploads, enforce) room
    # to run after a fetch that hits its own step cap.
    timeout-minutes: 80
    # Reads the repo and the refresh-state branch only. Artifact uploads use the
    # runner's ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    outputs:
      # Step outcome, not job result: the fetch step is continue-on-error, so the
      # job result is `success` even when it failed.
      oecd_outcome: ${{ steps.ingest_oecd.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        timeout-minutes: 10
        run: pip install -r requirements.txt

      # WS4-T17: is_numeric_slug()'s skip rule (WS4-T13) rests on a premise
      # -- every legacy numeric-slug page fails the body-shape check -- that
      # stops being observable the moment those URLs are never fetched. The
      # probe below samples a small, ROTATING slice of the skipped set each
      # run (see run_skip_sampling_probe()'s docstring in
      # scripts/ingest_oecd_aim.py); its rotation cursor must be durable
      # across runs (D5), so it is restored here BEFORE the ingest step that
      # consumes/advances it. This job only READS refresh-state; the advanced
      # cursor is uploaded below and persisted by the finalize job.
      - name: Restore OECD skip-probe rotation cursor from refresh-state branch
        timeout-minutes: 5
        run: |
          STATE_FILE="ingest/_state/skip_probe_state.json"
          mkdir -p "$(dirname "$STATE_FILE")"
          if git ls-remote --exit-code --heads origin refresh-state >/dev/null 2>&1; then
            git fetch --quiet origin refresh-state
            if git cat-file -e "origin/refresh-state:${STATE_FILE}" 2>/dev/null; then
              git show "origin/refresh-state:${STATE_FILE}" > "$STATE_FILE"
              echo "::notice::Restored $STATE_FILE from refresh-state branch."
            else
              echo "::notice::refresh-state branch exists but has no $STATE_FILE yet; probe starts a fresh rotation cursor."
            fi
          else
            echo "::notice::refresh-state branch does not exist yet; probe starts a fresh rotation cursor."
          fi

      - name: Refresh OECD AI Incidents Monitor
        timeout-minutes: 65
        id: ingest_oecd
        env:
          OECD_AIM_LIMIT: ${{ github.event.inputs.oecd_aim_limit || '3000' }}
        run: python scripts/ingest_oecd_aim.py
        continue-on-error: true

      # WS4-T17: a SEPARATE gate from the ingest step above on purpose -- see
      # check_probe_state_for_violations()'s docstring
      # (scripts/ingest_oecd_aim.py). A skip-rule violation (a legacy
      # numeric-slug URL that now returns a real incident body) is a
      # deterministic correctness signal, not third-party flakiness, and
      # must fail the RUN loudly on the FIRST occurrence rather than being
      # smoothed by source_health.json's 3-consecutive-failures threshold
      # (WS4-T9). `continue-on-error: true` (recorded via `id: skip_probe`)
      # so the uploads below still run; the loud, job-ending failure happens
      # in the "Enforce OECD skip-rule sampling probe" step at the very end.
      - name: Check OECD skip-rule sampling probe
        timeout-minutes: 5
        id: skip_probe
        continue-on-error: true
        # Only when the ingest step itself completed cleanly -- if it failed
        # for an unrelated reason (e.g. the sitemap fetch itself errored)
        # main() never reached the probe section, so the persisted state is
        # from a PRIOR run and checking it here would attribute a possibly-
        # stale finding to this run. An ingest failure is already covered by
        # source_health.json's own 3-consecutive-failures accounting (finalize).
        if: steps.ingest_oecd.outcome == 'success'
        run: python scripts/ingest_oecd_aim.py --check-probe

      # D114: the fresh OECD bytes never reach the merge. Stash them (and restore
      # the tree to HEAD) with the same script the refresh job uses, and upload
      # the stash for the D42 review path. The artifact name is the one the PR
      # body cites. Stash dir under runner.temp, never in the work tree.
      - name: Stash fresh OECD bytes for the D42 review path
        timeout-minutes: 5
        if: always()
        run: python scripts/hold_pair_inputs.py --stash-dir "$RUNNER_TEMP/held-pair-inputs"

      - name: Upload held OECD/AIID inputs (D42 review path)
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-oecd-aiid-inputs
          path: ${{ runner.temp }}/held-pair-inputs
          if-no-files-found: warn
          retention-days: 30

      # Hand the advanced rotation cursor to the finalize job (the single
      # refresh-state writer). if: always() so a failed or timed-out fetch still
      # hands over whatever cursor is on disk, as the in-job persist did before.
      # The file legitimately may not exist (first run, nothing skipped).
      - name: Upload OECD skip-probe rotation cursor
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecd-skip-probe-state
          path: ingest/_state/skip_probe_state.json
          if-no-files-found: ignore
          retention-days: 14

      # WS4-T17: same end-of-job pattern as the finalize job's "Enforce source
      # health": a violation fails this job (so the run ends red and GitHub's
      # failed-scheduled-workflow notification fires) without having blocked the
      # PR that carries this week's actually-good data.
      - name: Enforce OECD skip-rule sampling probe
        timeout-minutes: 5
        if: ${{ always() && steps.skip_probe.outcome == 'failure' }}
        run: |
          echo "::error::The OECD AIM skip-rule sampling probe found at least one legacy numeric-slug URL that now returns a real incident body (see 'Check OECD skip-rule sampling probe' step above for which one). is_numeric_slug()'s skip rule is dropping real incidents and needs attention before the next scheduled crawl. Failing this run on purpose so it cannot be mistaken for success."
          exit 1

  refresh:
    runs-on: ubuntu-latest
    # D142 (2026-10-28) raised this 60 -> 100 because the OECD fetch (50.8 min)
    # shared the job. D146-1 (2026-10-29) moved the fetch to the `oecd-fetch` job,
    # so this job no longer waits for it: its measured need is the old 63 min
    # minus the OECD step, about 12 min (unit tests 7.6 + about 4.5 other).
    # 40 min = more than 3x that, and above the tests cap (25) + other (4.5).
    # Every step that can hang has its own timeout-minutes below, so a hang
    # fails fast at the step instead of consuming this budget.
    timeout-minutes: 40
    needs: cve-sweep
    # run even when the sweep job failed or was skipped: it is not a gate
    if: ${{ !cancelled() }}
    # Step outcomes the finalize job feeds to the source-health counter and the
    # summary. Step outcome, not job result: these steps are continue-on-error.
    outputs:
      aiaaic_outcome: ${{ steps.ingest_aiaaic.outcome }}
      kev_outcome: ${{ steps.ingest_kev.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        timeout-minutes: 10
        run: pip install -r requirements.txt

      # D108 (2026-10-13): the AIRI Navigator source is RETIRED. Its last
      # successful download was on 2026-05-31 and it has 404ed since 2026-06-07, so it is no longer fetched (the D95 monthly
      # retry and the try_airi input are gone), and scripts/check_source_health.py
      # (RETIRED_SOURCES) never alerts on it. Its existing rows stay in the build
      # unchanged: ingest/airi_navigator_incidents.json is committed and is still
      # held/restored by hold_pair_inputs.py. Revisit only if the site returns.

      - name: Refresh AIAAIC sheet
        timeout-minutes: 10
        id: ingest_aiaaic
        env:
          AIAAIC_ACCEPT_YIELD_DROP: ${{ github.event.inputs.accept_aiaaic_yield_drop == 'true' && '1' || '' }}
          # B3: written (outside the work tree) only if the yield floor is overridden;
          # the PR-body step appends it so the PR alone shows the override.
          AIAAIC_OVERRIDE_MARKER: ${{ runner.temp }}/aiaaic-yield-override.md
        run: python scripts/ingest_aiaaic_sheet.py
        continue-on-error: true

      # WS4-T14 (D25(c), D42): keep ingest/aiid_full.json current. The OECD
      # monitor cites AIID ids newer than the committed snapshot (max id 1581
      # vs OECD citing up to 1702 on 2026-10-03), which is what produced the
      # weekly E21 tripwire population (docs/audits/refresh-tripwire-2026-10-03.md).
      # AIID's sanctioned weekly bulk channel only (D1): one GET of the
      # snapshots index and one GET of the newest backup tarball, both through
      # ingest/common.py (robots check, rate limit, identifying User-Agent).
      # continue-on-error like the other sources; a failure leaves last
      # week's snapshot in place and is reported in the summary below. The
      # merge step is gated by D42's build-time guard, so a snapshot that
      # newly links already-published entries cannot reach a PR unreviewed.
      - name: Refresh AIID snapshot (sanctioned bulk channel)
        timeout-minutes: 15
        id: ingest_aiid
        run: python scripts/ingest_aiid_snapshot.py
        continue-on-error: true

      - name: Refresh CISA KEV catalog
        timeout-minutes: 10
        id: ingest_kev
        run: python scripts/ingest_cisa_kev.py
        continue-on-error: true

      # The ingest steps are continue-on-error so one flaky source doesn't
      # block the others. D146-1: the OECD fetch is a separate job that this job
      # does not wait for, so its outcome is not known here. The "all sources
      # failed" abort that used to live in this step (AIAAIC and OECD both
      # failed) moved to the finalize job's "Abort check", which sees both
      # outcomes and fails the run loudly; the PR is no longer withheld for it.
      - name: Ingest result summary
        timeout-minutes: 5
        env:
          AIAAIC: ${{ steps.ingest_aiaaic.outcome }}
          CVE_SWEEP: ${{ needs.cve-sweep.outputs.sweep_outcome || needs.cve-sweep.result }}
          AIID: ${{ steps.ingest_aiid.outcome }}
        run: |
          {
            echo "### Source refresh results (refresh job)"
            echo "| Source | Outcome |"
            echo "|---|---|"
            echo "| AIRI Navigator | retired 2026-10-13 (D108); existing rows retained |"
            echo "| AIAAIC sheet | $AIAAIC |"
            echo "| OECD AI Incidents Monitor | separate job (oecd-fetch); outcome in the finalize job summary |"
            echo "| CVE rejection/dispute sweep (separate job) | $CVE_SWEEP |"
            echo "| AIID snapshot | $AIID |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$AIID" != "success" ]; then
            echo "::warning::AIID snapshot refresh failed -- ingest/aiid_full.json is last week's snapshot; OECD rows citing newer AIID ids will be unlinked-to-snapshot (WS4-T14)."
          fi
          if [ "$AIAAIC" != "success" ]; then
            echo "::warning::AIAAIC sheet refresh failed -- the PR will carry last week's AIAAIC data."
          fi

      # v2.13.0 item 3: bring the sweep job's snapshot and dated log into this
      # job's tree before the merge reads ingest/cve_rejections.json. Missing
      # artifact (sweep job died before upload) = keep the committed snapshot.
      - name: Download CVE sweep output
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: cve-sweep-output
          path: sweep-out
        continue-on-error: true

      - name: Apply CVE sweep output
        timeout-minutes: 5
        run: |
          if [ -f sweep-out/cve_rejections.json ]; then
            cp sweep-out/cve_rejections.json ingest/cve_rejections.json
            mkdir -p docs/audits/cve-sweep
            for f in sweep-out/*.md sweep-out/[0-9]*.json; do
              [ -f "$f" ] && cp "$f" docs/audits/cve-sweep/ || true
            done
            echo "::notice::Applied the CVE sweep job's snapshot and log."
          else
            echo "::warning::No CVE sweep output; the committed ingest/cve_rejections.json is used unchanged."
          fi
          rm -rf sweep-out

      # v2.13.0 D66 (decouple): the OECD/AIID pair is FROZEN (D58/D67/D71, stage
      # 1; the D42 build-time gate in merge_and_dedupe.py fails the build when a
      # pair input would change a published row). The fetchers above still run,
      # but their output must not reach the merge, or the gate aborts the whole
      # job and AIAAIC / KEV / the CVE sweep / D60 retractions are lost with it
      # (and the corpus-pinned tests fail, which is what has kept this workflow
      # red since 2026-09-14). So restore every frozen pair input to its
      # committed version here and upload the fresh bytes for the D42 review
      # path. The gate itself is unchanged and still runs in the merge below; the
      # script re-checks the result with the gate's own detector. If AIRI comes
      # back, its file is held too (it is in _PAIR_INPUT_FILES): a revived AIRI
      # lands in the artifact, not in the PR.
      # D114 (2026-10-13): the AIID snapshot (ingest/aiid_full.json + sidecar) is
      # LIFTED and no longer restored here; only the OECD side is held. The gate
      # applies a standing AIID class while every held input is at HEAD, and
      # refuses any OECD lift without a gated suppression mechanism.
      # D146-1: the OECD fetch no longer runs in this job (see `oecd-fetch`), so
      # this tree already carries the committed OECD bytes and the stash below is
      # normally empty. The restore, the gate's own re-check and the --check-clean
      # guard before the PR step stay exactly as they were: nothing in this job can
      # lift OECD, and a revived AIRI or any other pair input is still held. The
      # fresh OECD bytes for the D42 review are the `held-oecd-aiid-inputs`
      # artifact uploaded by the oecd-fetch job.
      - name: Hold OECD/AIID pair inputs at their committed versions
        timeout-minutes: 5
        run: python scripts/hold_pair_inputs.py --stash-dir "$RUNNER_TEMP/held-pair-inputs"

      - name: Upload refresh-job hold stash (normally empty; the OECD bytes are in the oecd-fetch job artifact)
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-refresh-job-pair-inputs
          path: ${{ runner.temp }}/held-pair-inputs
          if-no-files-found: warn
          retention-days: 30

      - name: Re-merge + render + validate
        timeout-minutes: 15
        # D127: the ONLY job that tells merge_and_dedupe.py it is the weekly refresh,
        # so an abort says "the whole refresh did not ship". Other workflows must not set it.
        env:
          GENAI_REFRESH_RUN: "1"
        run: |
          python scripts/parse_existing.py
          python scripts/merge_and_dedupe.py
          python scripts/render_markdown.py
          python scripts/render_docs_stats.py
          python scripts/validate.py
          python scripts/lint_atlas_ids.py

      # Invariant 6 hard gate (PR #102 shipped README/DATASHEET/index.html at the
      # old total because this workflow never ran the doc-stats step): a refresh
      # whose counts moved but whose doc surfaces did not follow fails here,
      # before any PR is opened. Mirrors `make build` + `make check-stats-drift`.
      - name: Doc surfaces match stats.json (invariant 6)
        timeout-minutes: 5
        run: python scripts/check_stats_drift.py

      # Hard gate: the same suite that runs on every PR/push. A regression in the
      # refreshed data or generated outputs blocks the PR instead of shipping it.
      - name: Unit tests
        timeout-minutes: 25
        run: pytest tests -q

      - name: Show summary
        timeout-minutes: 5
        run: |
          echo "::group::Diff stats"
          git diff --stat || true
          echo "::endgroup::"
          echo "::group::Counts"
          python -c "import json; d=json.load(open('data/incidents.json')); print('total:', d['incident_count']); print('generated:', d['generated'])"
          echo "::endgroup::"

      # v2.13.0 item 3 / D60: flag, don't block. List every entry this build
      # newly retracts (retracted here, not retracted on main) in the PR body,
      # and label the PR `needs-ruling` when any of them is a landmark entry or
      # more than 10 are retracted. See scripts/newly_retracted_report.py.
      - name: Newly retracted entries report
        timeout-minutes: 10
        id: retracted
        # D60 "never block": a failure here must not skip the PR. The script
        # below already has a fallback; continue-on-error is the belt to that
        # braces. An unknown retraction state is flagged, not passed as clean:
        # the fallback sets needs_ruling=true, and the label/removal steps treat
        # anything other than an explicit 'false' as "needs a ruling".
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Automated weekly refresh of external sources. This PR carries the
          AIAAIC sheet, the CISA KEV catalog, the CVE rejection sweep (with
          the D60 retractions) and the AIID snapshot (lifted under D114); the
          OECD AI Incidents Monitor inputs are held out (see below). The AIRI Navigator source is retired
          (D108, 2026-10-13): it is no longer fetched and its existing rows are
          retained unchanged.

          On each run this branch is recreated from the current `main`, so the
          diff is always relative to the latest `main` *at run time*. **Merge
          promptly** — if commits land on `main` after this PR opens, the open
          branch goes stale and merging it can revert that newer work. If it
          has sat open across other merges, close it and re-run this workflow
          (Actions → "Weekly auto-refresh" → Run workflow) rather than merging.

          The OECD AI Incidents Monitor inputs (and the AIID side files nothing
          regenerates) are HELD at their committed versions (D66; the stage-1
          freeze, D58/D67/D71; D114 lifted the AIID snapshot only). New AIID
          rows and AIID title edits in this PR passed the gate's standing AIID
          class (D114); merges and retitles that absorb ids still need per-item
          approval. Any OECD lift is refused until suppression is built and
          gated (D114 binding precondition). The fresh OECD bytes are in the
          run's `held-oecd-aiid-inputs` artifact for the D42 review.

          Review the diff before merging — flag any unexpected mass deletions
          or large taxonomy shifts. Schema validation and the full unit-test
          suite both ran green in this workflow before the PR was opened.

          BODY
          if [ -s "$RUNNER_TEMP/aiaaic-yield-override.md" ]; then
            cat "$RUNNER_TEMP/aiaaic-yield-override.md" >> "$RUNNER_TEMP/pr-body.md"
          fi
          if python scripts/newly_retracted_report.py --before-ref HEAD \
               --out-md "$RUNNER_TEMP/newly-retracted.md" --github-output "$GITHUB_OUTPUT"; then
            cat "$RUNNER_TEMP/newly-retracted.md" >> "$RUNNER_TEMP/pr-body.md"
          else
            echo "::warning::newly_retracted_report.py failed; flagging the PR needs-ruling (unknown retraction state)."
            {
              echo "### Newly retracted entries (CVE rejection sweep)"
              echo
              echo "**The retraction report could not be produced** (see the workflow run). The retraction state of this refresh is UNKNOWN, so the PR is labelled \`needs-ruling\`; compare \`status: retracted\` against \`main\` by hand. The refresh was not blocked."
            } >> "$RUNNER_TEMP/pr-body.md"
            echo "count=unknown" >> "$GITHUB_OUTPUT"
            echo "needs_ruling=true" >> "$GITHUB_OUTPUT"
          fi
          # D120: per-field report of AIID-driven changes (flag, never block).
          # Fails soft like the retraction report: on error the PR is marked
          # needs-ruling (a later needs_ruling=true output wins over the earlier
          # value) and the refresh continues.
          if python scripts/aiid_change_report.py --before-ref HEAD \
               --out-md "$RUNNER_TEMP/aiid-change-report.md" \
               --out-full-md "$RUNNER_TEMP/aiid-change-report-full.md"; then
            # D123: the PR body gets the capped copy (GitHub's body limit is
            # 65,536 characters); the full report goes to the step summary
            # (1 MiB limit, so clipped at 900,000 bytes) and to an artifact.
            { echo; cat "$RUNNER_TEMP/aiid-change-report.md"; } >> "$RUNNER_TEMP/pr-body.md"
            head -c 900000 "$RUNNER_TEMP/aiid-change-report-full.md" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "::warning::aiid_change_report.py failed; flagging the PR needs-ruling (unknown AIID change state)."
            {
              echo
              echo "### AIID-driven changes (D120 change report)"
              echo
              echo "**The AIID change report could not be produced** (see the workflow run). What the AIID snapshot changed in this refresh is UNKNOWN, so the PR is labelled \`needs-ruling\`; diff \`data/incidents.json\` against \`main\` by hand. The refresh was not blocked."
            } >> "$RUNNER_TEMP/pr-body.md"
            echo "needs_ruling=true" >> "$GITHUB_OUTPUT"
          fi

      # D123: the full, untruncated AIID change report (the PR body carries a
      # capped copy). Never blocks the refresh.
      - name: Upload full AIID change report
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aiid-change-report
          path: ${{ runner.temp }}/aiid-change-report-full.md
          if-no-files-found: ignore
          retention-days: 30

      # D123: GitHub rejects a PR body over 65,536 characters, which would make
      # create-pull-request fail instead of failing soft. Cap the assembled body.
      - name: Cap PR body size
        timeout-minutes: 5
        run: python scripts/cap_pr_body.py "$RUNNER_TEMP/pr-body.md"

      - name: Ensure needs-ruling label exists
        timeout-minutes: 5
        if: steps.retracted.outputs.needs_ruling != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create needs-ruling --color B60205 --description "Refresh retracts a landmark entry or more than 10 entries; needs a human ruling" || true

      # create-pull-request commits EVERYTHING in the work tree. The held
      # OECD/AIID bytes live only in the artifact (stash under runner.temp);
      # this fails the run, before any PR is opened, if a held path differs
      # from HEAD or stash content is anywhere in the tree (PR #101, 2026-10-13).
      - name: Guard - no held path or stash content in the work tree
        timeout-minutes: 5
        run: python scripts/hold_pair_inputs.py --check-clean --stash-dir "$RUNNER_TEMP/held-pair-inputs"

      - name: Open / update refresh PR
        timeout-minutes: 10
        id: cpr
        # Pinned to a full commit SHA (v7) for supply-chain safety; bump
        # deliberately rather than tracking a mutable tag.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(data): weekly auto-refresh"
          branch: auto-refresh/data
          base: main
          delete-branch: true
          title: "Weekly data refresh"
          labels: ${{ steps.retracted.outputs.needs_ruling != 'false' && 'data-refresh, automated, needs-ruling' || 'data-refresh, automated' }}
          body-path: ${{ runner.temp }}/pr-body.md

      # A later CLEAN run updating the same open PR must not leave a stale
      # needs-ruling label from an earlier run. Only on an explicit 'false'.
      - name: Remove stale needs-ruling label
        timeout-minutes: 5
        if: steps.retracted.outputs.needs_ruling == 'false' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr edit "$PR" --remove-label needs-ruling || true

  # D146-1: the SINGLE WRITER of the `refresh-state` branch. Runs after both the
  # refresh job and the OECD job so it sees every source's outcome, but nothing
  # in the refresh PR path waits for it: the PR is opened inside `refresh`.
  # Having one writer is the race-free design: persist_refresh_state.sh does a
  # read-modify-write of one file and force-pushes, so two jobs persisting
  # (or even one job per file, both force-pushing the same branch) could lose
  # each other's commit. Here the two persists run sequentially in one job.
  #
  # WS4-T9: the "all sources failed" check in `refresh` only catches
  # "everything failed on the SAME run". A single source that fails every week
  # forever sails through it as long as another source succeeds. This job
  # tracks CONSECUTIVE failures per source in ingest/_state/source_health.json
  # and ends the run red when one is dead (see scripts/check_source_health.py).
  #
  # D5: the counter must be durable independent of the data-review PR (PRs
  # #2/#18/#25 were closed unmerged and silently ate it). So it is restored from
  # the long-lived `refresh-state` branch, updated, and persisted back there.
  # `refresh-state` is machine-state-only: never merged into `main`, not
  # human-reviewed, force-pushed every run, documented as unreviewed-by-design.
  # This job has no PR work tree to protect, so unlike the old in-refresh steps
  # it does not reset the state files afterwards.
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [refresh, oecd-fetch]
    # a failed or skipped upstream job is exactly when the counter matters
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore source health counters from refresh-state branch
        timeout-minutes: 5
        run: |
          STATE_FILE="ingest/_state/source_health.json"
          if git ls-remote --exit-code --heads origin refresh-state >/dev/null 2>&1; then
            git fetch --quiet origin refresh-state
            if git cat-file -e "origin/refresh-state:${STATE_FILE}" 2>/dev/null; then
              git show "origin/refresh-state:${STATE_FILE}" > "$STATE_FILE"
              echo "::notice::Restored $STATE_FILE from refresh-state branch."
            else
              echo "::notice::refresh-state branch exists but has no $STATE_FILE yet; using in-repo copy."
            fi
          else
            echo "::notice::refresh-state branch does not exist yet; using in-repo copy (branch created on first push below)."
          fi

      - name: Source health check (consecutive-failure tracking)
        timeout-minutes: 5
        id: health
        continue-on-error: true
        env:
          # D108: airi_navigator is deliberately absent. The checker stamps it
          # `retired` from its own RETIRED_SOURCES list, whatever the restored state says.
          # An output that is missing because its job died or timed out is a
          # FAILED source, never a skipped one: `|| 'failure'`.
          AIAAIC: ${{ needs.refresh.outputs.aiaaic_outcome || 'failure' }}
          OECD: ${{ needs.oecd-fetch.outputs.oecd_outcome || 'failure' }}
          KEV: ${{ needs.refresh.outputs.kev_outcome || 'failure' }}
        run: |
          python scripts/check_source_health.py \
            --outcomes-json "{\"aiaaic_sheet\": \"$AIAAIC\", \"oecd_aim\": \"$OECD\", \"cisa_kev\": \"$KEV\"}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Persist source health counters to refresh-state branch
        timeout-minutes: 5
        run: |
          set -e
          bash scripts/persist_refresh_state.sh \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "ingest/_state/source_health.json" \
            "/tmp/refresh-state-clone"

      # WS4-T17: same D5 durability pattern for the skip-probe rotation cursor
      # advanced by the oecd-fetch job, handed over as an artifact. A separate
      # persist_refresh_state.sh invocation (own throwaway clone dir) so it lands
      # as its own commit on `refresh-state`.
      - name: Download OECD skip-probe rotation cursor
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: oecd-skip-probe-state
          path: oecd-probe-state
        continue-on-error: true

      - name: Persist OECD skip-probe state to refresh-state branch
        timeout-minutes: 5
        run: |
          set -e
          STATE_FILE="ingest/_state/skip_probe_state.json"

          # The file may legitimately not exist: the very first run ever, on a
          # crawl window where nothing was skipped (no numeric-slug URLs -- see
          # ingest_oecd_aim.py main()'s "nothing skipped this run" branch), or
          # the OECD job died before uploading. persist_refresh_state.sh itself
          # errors on a missing file, so skip the call rather than failing this
          # step for a state file that simply is not there.
          if [ -f oecd-probe-state/skip_probe_state.json ]; then
            mkdir -p "$(dirname "$STATE_FILE")"
            cp oecd-probe-state/skip_probe_state.json "$STATE_FILE"
            bash scripts/persist_refresh_state.sh \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$STATE_FILE" \
              "/tmp/refresh-state-clone-probe"
          else
            echo "::notice::No skip-probe state handed over (nothing skipped this run, or the OECD job did not upload); nothing to persist."
          fi

      # The legacy "all sources failed" abort (AIAAIC and OECD both failed),
      # moved here from the refresh job's summary step because only this job
      # sees both outcomes. It can no longer withhold the PR (the PR is already
      # open by now); it ends the run red instead.
      - name: Abort check (every source refresh failed)
        timeout-minutes: 5
        if: ${{ always() }}
        env:
          AIAAIC: ${{ needs.refresh.outputs.aiaaic_outcome || 'failure' }}
          OECD: ${{ needs.oecd-fetch.outputs.oecd_outcome || 'failure' }}
        run: |
          {
            echo "### Source refresh results (final)"
            echo "| Source | Outcome |"
            echo "|---|---|"
            echo "| AIAAIC sheet | $AIAAIC |"
            echo "| OECD AI Incidents Monitor | $OECD |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          total=2  # AIAAIC + OECD (AIRI retired, D108)
          [ "$AIAAIC" = "success" ] && ok=$((ok+1))
          [ "$OECD" = "success" ] && ok=$((ok+1))
          if [ "$ok" -eq 0 ]; then
            echo "::error::Every source refresh failed -- the data would be stale. The refresh PR may already be open with last week's AIAAIC data; do not merge it as a refresh. Failing this run on purpose."
            exit 1
          fi
          if [ "$ok" -lt "$total" ]; then
            echo "::warning::Only $ok of $total sources refreshed -- the PR carries last week's data for the failed source(s)."
          fi

      # Runs LAST so a persistently-dead source never blocks the sources that ARE
      # working -- but the workflow RUN itself still ends red and GitHub's own
      # failed-scheduled-workflow notification fires. A source stays loud every
      # single week until it recovers, or someone pauses it with a reason AND an
      # expiry (`paused_until`) in ingest/_state/source_health.json -- an
      # expired, malformed, or absurdly-far-future pause is not honored (see
      # scripts/check_source_health.py). `always()` so a failed earlier step
      # cannot skip this and silence a dead source.
      - name: Enforce source health
        timeout-minutes: 5
        if: ${{ always() && steps.health.outcome == 'failure' }}
        run: |
          echo "::error::A source has failed 3+ consecutive weekly refreshes (see 'Source health check' step above). Failing this run on purpose so it cannot be mistaken for success."
          exit 1
