name: Weekly auto-refresh

on:
  schedule:
    # Sundays at 04:00 UTC. Adjust if you'd prefer a different cadence.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      oecd_aim_limit:
        description: "Max OECD AIM pages to fetch (0 = all)"
        default: "3000"

permissions:
  contents: write
  pull-requests: write

# Never let a scheduled run and a manual dispatch (or two schedules) race on the
# shared auto-refresh/data branch. Queue them instead of cancelling so a run is
# never interrupted mid-commit.
concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  # WS4-T2 / v2.13.0 item 3: a CVE rejected after it was ingested must be
  # retracted, not left live. Feeder = NVD CVEs modified in the last 10 days (a
  # rejection is a modification); the rotation budget re-checks the stalest ids.
  #
  # WHY A SEPARATE JOB (BOUNCE #1, docs/audits/rejected-cve-sweep-gap-2026-10-09.md
  # addendum 2026-10-09b): the OECD step alone takes 25-51 min and the refresh
  # job's limit is 60, so a sweep step inside it could be cancelled with the
  # job -- losing the health-counter persistence, the re-merge, the tests, the
  # PR and the sweep's own snapshot. Here the sweep has its own 60-minute
  # limit; it is capped by wall clock (--max-seconds 2400) so it stops cleanly
  # and writes its snapshot and log; and its output reaches the refresh job as
  # an artifact uploaded with `if: always()`.
  #
  # Throughput: --max-requests 1200 at about 1.07 s/request measured (1 req/s
  # floor in ingest/common.py) = about 21 min; 2400 s allows 1,200 requests even
  # at 2.0 s/request. Every corpus CVE is re-checked within ceil(N/1200) weeks
  # (9,169 ids = 8 weeks; 16 at the old budget of 600). Never-checked ids and
  # records that predate dispute detection sort first. The step also records
  # DISPUTED CVEs and writes the dated log docs/audits/cve-sweep/<date>.{md,json};
  # it exits non-zero when more than 10% of the fetches fail (continue-on-error:
  # the PR is not blocked, the outcome is shown in the summary).
  cve-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The sweep only reads the repo; the artifact upload uses the runner's
    # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so no write scope is needed.
    permissions:
      contents: read
    # The sweep step is continue-on-error (the PR must not be blocked), which
    # makes this job's own `result` always `success`. Expose the STEP outcome
    # so the refresh job's summary can show a >10% fail rate, a crash or the
    # backstop as a failure.
    outputs:
      sweep_outcome: ${{ steps.ingest_cve_rejections.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh CVE rejection snapshot
        id: ingest_cve_rejections
        timeout-minutes: 45
        run: python scripts/ingest_cve_rejections.py --nvd-modified-days 10 --max-requests 1200 --max-seconds 2400
        continue-on-error: true

      - name: Collect sweep output
        if: always()
        run: |
          mkdir -p sweep-out
          cp ingest/cve_rejections.json sweep-out/ 2>/dev/null || true
          cp docs/audits/cve-sweep/"$(date -u +%F)".* sweep-out/ 2>/dev/null || true
          ls -la sweep-out

      - name: Upload sweep output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cve-sweep-output
          path: sweep-out
          if-no-files-found: warn
          retention-days: 3

  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: cve-sweep
    # run even when the sweep job failed or was skipped: it is not a gate
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh AIRI Navigator
        id: ingest_airi
        run: python scripts/ingest_airi_navigator.py
        continue-on-error: true

      - name: Refresh AIAAIC sheet
        id: ingest_aiaaic
        run: python scripts/ingest_aiaaic_sheet.py
        continue-on-error: true

      # WS4-T17: is_numeric_slug()'s skip rule (WS4-T13) rests on a premise
      # -- every legacy numeric-slug page fails the body-shape check -- that
      # stops being observable the moment those URLs are never fetched. The
      # probe below samples a small, ROTATING slice of the skipped set each
      # run (see run_skip_sampling_probe()'s docstring in
      # scripts/ingest_oecd_aim.py); its rotation cursor must be durable
      # across runs the same way the source-health counter is (D5), so it's
      # restored here BEFORE the ingest step that consumes/advances it, and
      # persisted below alongside source_health.json. Unlike source_health.json
      # (only read by the "Source health check" step further down), this one
      # is read AND written by ingest_oecd_aim.py itself, so it must land on
      # disk before that step runs, not after.
      - name: Restore OECD skip-probe rotation cursor from refresh-state branch
        run: |
          STATE_FILE="ingest/_state/skip_probe_state.json"
          mkdir -p "$(dirname "$STATE_FILE")"
          if git ls-remote --exit-code --heads origin refresh-state >/dev/null 2>&1; then
            git fetch --quiet origin refresh-state
            if git cat-file -e "origin/refresh-state:${STATE_FILE}" 2>/dev/null; then
              git show "origin/refresh-state:${STATE_FILE}" > "$STATE_FILE"
              echo "::notice::Restored $STATE_FILE from refresh-state branch."
            else
              echo "::notice::refresh-state branch exists but has no $STATE_FILE yet; probe starts a fresh rotation cursor."
            fi
          else
            echo "::notice::refresh-state branch does not exist yet; probe starts a fresh rotation cursor."
          fi

      - name: Refresh OECD AI Incidents Monitor
        id: ingest_oecd
        env:
          OECD_AIM_LIMIT: ${{ github.event.inputs.oecd_aim_limit || '3000' }}
        run: python scripts/ingest_oecd_aim.py
        continue-on-error: true

      # WS4-T17: a SEPARATE gate from the ingest step above on purpose -- see
      # check_probe_state_for_violations()'s docstring
      # (scripts/ingest_oecd_aim.py). A skip-rule violation (a legacy
      # numeric-slug URL that now returns a real incident body) is a
      # deterministic correctness signal, not third-party flakiness, and
      # must fail the RUN loudly on the FIRST occurrence rather than being
      # smoothed by source_health.json's 3-consecutive-failures threshold
      # (WS4-T9). `continue-on-error: true` here (recorded via `id:
      # skip_probe`) so a violation doesn't skip the rest of this job --
      # the merge/render/validate/tests/PR steps below still need to run
      # normally; a skip-rule violation says nothing about whether THIS
      # week's actually-kept data is good. The loud, job-ending failure
      # happens in the "Enforce OECD skip-rule sampling probe" step at the
      # very end, mirroring "Enforce source health"'s own established
      # end-of-job pattern (see that step's comment for the same rationale
      # applied to source_health.json).
      - name: Check OECD skip-rule sampling probe
        id: skip_probe
        continue-on-error: true
        # Only when the ingest step itself completed cleanly -- if it failed
        # for an unrelated reason (e.g. the sitemap fetch itself errored)
        # main() never reached the probe section, so the persisted state is
        # from a PRIOR run and checking it here would attribute a possibly-
        # stale finding to this run. An ingest failure is already covered by
        # source_health.json's own 3-consecutive-failures accounting below.
        if: steps.ingest_oecd.outcome == 'success'
        run: python scripts/ingest_oecd_aim.py --check-probe

      - name: Refresh CISA KEV catalog
        id: ingest_kev
        run: python scripts/ingest_cisa_kev.py
        continue-on-error: true

      # The ingest steps are continue-on-error so one flaky source doesn't
      # block the others — but if ALL of them failed, the "refreshed" data is
      # just last week's cache and the PR would ship silent staleness. Surface
      # per-source outcomes and abort in the nothing-refreshed case.
      - name: Ingest result summary
        env:
          AIRI: ${{ steps.ingest_airi.outcome }}
          AIAAIC: ${{ steps.ingest_aiaaic.outcome }}
          OECD: ${{ steps.ingest_oecd.outcome }}
          CVE_SWEEP: ${{ needs.cve-sweep.outputs.sweep_outcome || needs.cve-sweep.result }}
        run: |
          {
            echo "### Source refresh results"
            echo "| Source | Outcome |"
            echo "|---|---|"
            echo "| AIRI Navigator | $AIRI |"
            echo "| AIAAIC sheet | $AIAAIC |"
            echo "| OECD AI Incidents Monitor | $OECD |"
            echo "| CVE rejection/dispute sweep (separate job; not counted toward the all-failed abort) | $CVE_SWEEP |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          [ "$AIRI" = "success" ] && ok=$((ok+1))
          [ "$AIAAIC" = "success" ] && ok=$((ok+1))
          [ "$OECD" = "success" ] && ok=$((ok+1))
          if [ "$ok" -eq 0 ]; then
            echo "::error::All three source refreshes failed — the data would be stale. Aborting instead of opening a misleading refresh PR."
            exit 1
          fi
          if [ "$ok" -lt 3 ]; then
            echo "::warning::Only $ok of 3 sources refreshed — the PR will carry last week's data for the failed source(s)."
          fi

      # WS4-T9: the check above only catches "everything failed on the SAME
      # run". A single source that fails every week forever (AIRI Navigator,
      # dead since 2026-06-07) sails through it silently as long as at least
      # one other source succeeds, and the job keeps reporting overall
      # "success" — so nobody watching the repo is ever notified. This step
      # tracks CONSECUTIVE failures per source in
      # ingest/_state/source_health.json.
      #
      # D5: the counter this check reads/writes must be durable independent
      # of the data-review PR below (see the KNOWN LIMITATION this fixed:
      # PRs #2/#18/#25 in this repo's history were closed unmerged and
      # superseded, silently eating the counter). So immediately before
      # this step, restore the counter from the long-lived `refresh-state`
      # branch — not from whatever's on `main` or sitting in an open PR —
      # and immediately after, persist it back there (see the two steps
      # below). `refresh-state` is machine-state-only: never merged into
      # `main`, not human-reviewed, force-pushed every run, documented as
      # unreviewed-by-design. This keeps "everything on main is reviewed"
      # intact while making the counter durable without an unattended write
      # to `main` itself (main has no branch protection — see WS4-T7).
      - name: Restore source health counters from refresh-state branch
        run: |
          STATE_FILE="ingest/_state/source_health.json"
          if git ls-remote --exit-code --heads origin refresh-state >/dev/null 2>&1; then
            git fetch --quiet origin refresh-state
            if git cat-file -e "origin/refresh-state:${STATE_FILE}" 2>/dev/null; then
              git show "origin/refresh-state:${STATE_FILE}" > "$STATE_FILE"
              echo "::notice::Restored $STATE_FILE from refresh-state branch."
            else
              echo "::notice::refresh-state branch exists but has no $STATE_FILE yet; using in-repo copy."
            fi
          else
            echo "::notice::refresh-state branch does not exist yet; using in-repo copy (branch created on first push below)."
          fi

      - name: Source health check (consecutive-failure tracking)
        id: health
        continue-on-error: true
        env:
          AIRI: ${{ steps.ingest_airi.outcome }}
          AIAAIC: ${{ steps.ingest_aiaaic.outcome }}
          OECD: ${{ steps.ingest_oecd.outcome }}
          KEV: ${{ steps.ingest_kev.outcome }}
        run: |
          python scripts/check_source_health.py \
            --outcomes-json "{\"airi_navigator\": \"$AIRI\", \"aiaaic_sheet\": \"$AIAAIC\", \"oecd_aim\": \"$OECD\", \"cisa_kev\": \"$KEV\"}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # D5, continued: push the just-updated counter to `refresh-state` via
      # a throwaway clone (so this can never touch the working tree that's
      # about to become the data-review PR below), then reset the working
      # copy back to what's committed on `main` — no diff, nothing left for
      # `create-pull-request` to pick up. `refresh-state` is now the single
      # source of truth for the counter, so a data-review PR closed without
      # merging can no longer strand it (see the tripwire workflow that
      # comments on such PRs: .github/workflows/refresh-pr-closed-tripwire.yml).
      - name: Persist source health counters to refresh-state branch
        run: |
          set -e
          STATE_FILE="ingest/_state/source_health.json"

          bash scripts/persist_refresh_state.sh \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$STATE_FILE" \
            "/tmp/refresh-state-clone"

          # Exclude the counter from the data-review PR (refresh-state,
          # above, is now the single source of truth): reset the
          # working-tree copy back to whatever's committed on `main`.
          git checkout -- "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"

      # WS4-T17: same D5 durability pattern, applied to the skip-probe
      # rotation cursor written/advanced by ingest_oecd_aim.py above -- a
      # separate persist_refresh_state.sh invocation (own throwaway clone
      # dir) so it lands as its own commit on `refresh-state`, then the
      # same "exclude from the data-review PR" reset.
      - name: Persist OECD skip-probe state to refresh-state branch
        run: |
          set -e
          STATE_FILE="ingest/_state/skip_probe_state.json"

          # The file may legitimately not exist yet: the very first run ever,
          # on a crawl window where nothing was skipped this time (no
          # numeric-slug URLs in the window -- see ingest_oecd_aim.py main()'s
          # "nothing skipped this run" branch), so run_skip_sampling_probe()
          # was never called and never wrote it. persist_refresh_state.sh
          # itself errors on a missing file (nothing to persist), so skip the
          # call entirely rather than failing this step for a state file that
          # simply hasn't been created yet.
          if [ -f "$STATE_FILE" ]; then
            bash scripts/persist_refresh_state.sh \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$STATE_FILE" \
              "/tmp/refresh-state-clone-probe"
            git checkout -- "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"
          else
            echo "::notice::$STATE_FILE does not exist yet (nothing skipped this run); nothing to persist."
          fi

      # v2.13.0 item 3: bring the sweep job's snapshot and dated log into this
      # job's tree before the merge reads ingest/cve_rejections.json. Missing
      # artifact (sweep job died before upload) = keep the committed snapshot.
      - name: Download CVE sweep output
        uses: actions/download-artifact@v4
        with:
          name: cve-sweep-output
          path: sweep-out
        continue-on-error: true

      - name: Apply CVE sweep output
        run: |
          if [ -f sweep-out/cve_rejections.json ]; then
            cp sweep-out/cve_rejections.json ingest/cve_rejections.json
            mkdir -p docs/audits/cve-sweep
            for f in sweep-out/*.md sweep-out/[0-9]*.json; do
              [ -f "$f" ] && cp "$f" docs/audits/cve-sweep/ || true
            done
            echo "::notice::Applied the CVE sweep job's snapshot and log."
          else
            echo "::warning::No CVE sweep output; the committed ingest/cve_rejections.json is used unchanged."
          fi
          rm -rf sweep-out

      - name: Re-merge + render + validate
        run: |
          python scripts/parse_existing.py
          python scripts/merge_and_dedupe.py
          python scripts/render_markdown.py
          python scripts/validate.py

      # Hard gate: the same suite that runs on every PR/push. A regression in the
      # refreshed data or generated outputs blocks the PR instead of shipping it.
      - name: Unit tests
        run: pytest tests -q

      - name: Show summary
        run: |
          echo "::group::Diff stats"
          git diff --stat || true
          echo "::endgroup::"
          echo "::group::Counts"
          python -c "import json; d=json.load(open('data/incidents.json')); print('total:', d['incident_count']); print('generated:', d['generated'])"
          echo "::endgroup::"

      # v2.13.0 item 3 / D60: flag, don't block. List every entry this build
      # newly retracts (retracted here, not retracted on main) in the PR body,
      # and label the PR `needs-ruling` when any of them is a landmark entry or
      # more than 10 are retracted. See scripts/newly_retracted_report.py.
      - name: Newly retracted entries report
        id: retracted
        # D60 "never block": a failure here must not skip the PR. The script
        # below already has a fallback; continue-on-error is the belt to that
        # braces. An unknown retraction state is flagged, not passed as clean:
        # the fallback sets needs_ruling=true, and the label/removal steps treat
        # anything other than an explicit 'false' as "needs a ruling".
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Automated weekly refresh of external sources:
          AIRI Navigator, AIAAIC sheet, OECD AI Incidents Monitor.

          On each run this branch is recreated from the current `main`, so the
          diff is always relative to the latest `main` *at run time*. **Merge
          promptly** — if commits land on `main` after this PR opens, the open
          branch goes stale and merging it can revert that newer work. If it
          has sat open across other merges, close it and re-run this workflow
          (Actions → "Weekly auto-refresh" → Run workflow) rather than merging.

          Review the diff before merging — flag any unexpected mass deletions
          or large taxonomy shifts. Schema validation and the full unit-test
          suite both ran green in this workflow before the PR was opened.

          BODY
          if python scripts/newly_retracted_report.py --before-ref HEAD \
               --out-md "$RUNNER_TEMP/newly-retracted.md" --github-output "$GITHUB_OUTPUT"; then
            cat "$RUNNER_TEMP/newly-retracted.md" >> "$RUNNER_TEMP/pr-body.md"
          else
            echo "::warning::newly_retracted_report.py failed; flagging the PR needs-ruling (unknown retraction state)."
            {
              echo "### Newly retracted entries (CVE rejection sweep)"
              echo
              echo "**The retraction report could not be produced** (see the workflow run). The retraction state of this refresh is UNKNOWN, so the PR is labelled \`needs-ruling\`; compare \`status: retracted\` against \`main\` by hand. The refresh was not blocked."
            } >> "$RUNNER_TEMP/pr-body.md"
            echo "count=unknown" >> "$GITHUB_OUTPUT"
            echo "needs_ruling=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure needs-ruling label exists
        if: steps.retracted.outputs.needs_ruling != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create needs-ruling --color B60205 --description "Refresh retracts a landmark entry or more than 10 entries; needs a human ruling" || true

      - name: Open / update refresh PR
        id: cpr
        # Pinned to a full commit SHA (v7) for supply-chain safety; bump
        # deliberately rather than tracking a mutable tag.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(data): weekly auto-refresh"
          branch: auto-refresh/data
          base: main
          delete-branch: true
          title: "Weekly data refresh"
          labels: ${{ steps.retracted.outputs.needs_ruling != 'false' && 'data-refresh, automated, needs-ruling' || 'data-refresh, automated' }}
          body-path: ${{ runner.temp }}/pr-body.md

      # A later CLEAN run updating the same open PR must not leave a stale
      # needs-ruling label from an earlier run. Only on an explicit 'false'.
      - name: Remove stale needs-ruling label
        if: steps.retracted.outputs.needs_ruling == 'false' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr edit "$PR" --remove-label needs-ruling || true

      # Runs LAST (after the PR is already opened, carrying whatever sources
      # did refresh — the source-health counter itself lives on
      # `refresh-state`, not this PR, per D5 above) so a persistently-dead
      # source never blocks the sources that ARE working — but the workflow
      # RUN itself still ends red and GitHub's own failed-scheduled-workflow
      # notification fires. This is the "can no longer pass a refresh as a
      # warning" gate from WS4-T9: a source stays loud every single week
      # until it recovers, or someone pauses it with a reason AND an expiry
      # (`paused_until`) in ingest/_state/source_health.json — an expired,
      # malformed, or absurdly-far-future pause is not honored (see
      # scripts/check_source_health.py).
      - name: Enforce source health
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::A source has failed 3+ consecutive weekly refreshes (see 'Source health check' step above). Failing this run on purpose so it cannot be mistaken for success."
          exit 1

      # WS4-T17: same end-of-job pattern as "Enforce source health" above,
      # for the SEPARATE reason explained on the "Check OECD skip-rule
      # sampling probe" step: a violation must fail this run's overall
      # conclusion loudly (GitHub's own failed-scheduled-workflow
      # notification fires) without having blocked the PR that carries this
      # week's actually-good data.
      - name: Enforce OECD skip-rule sampling probe
        if: steps.skip_probe.outcome == 'failure'
        run: |
          echo "::error::The OECD AIM skip-rule sampling probe found at least one legacy numeric-slug URL that now returns a real incident body (see 'Check OECD skip-rule sampling probe' step above for which one). is_numeric_slug()'s skip rule is dropping real incidents and needs attention before the next scheduled crawl. Failing this run on purpose so it cannot be mistaken for success."
          exit 1
