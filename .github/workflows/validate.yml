name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Full history + tags (v2.13.0 item 5, D52 advisory): pinned-blob tests
      # read historical data via `git show <commit>:data/incidents.json`
      # (test_precision_audit::test_reproduces_from_pinned_blob) and
      # `git show v2.10.0:...` (test_resolve_id_status); a shallow clone made
      # both skip. No other step in this job reads git history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests -q

      - name: Re-merge from ingest sources
        # D140/D141: the checkout already contains any override this change adds, so
        # the baseline for the retained-row URL check must be the state BEFORE it:
        # the PR base (HEAD^1 of the pull_request merge commit), or for a push the
        # previous tip of main (github.event.before; HEAD^1 would be wrong for a
        # multi-commit fast-forward push). FAIL CLOSED: if the push `before` SHA is
        # empty, all-zero (new branch), or not a commit in this clone (force-push
        # whose old tip is gone), this step fails with an ::error:: and does NOT
        # fall back to HEAD^1. Any other unresolvable value fails inside
        # merge_and_dedupe.py ([FATAL] D140).
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] \
               || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "::error::push baseline '${base}' is empty, all-zero, or not a commit in this clone (new branch, force-push, or missing before SHA); refusing to fall back to HEAD^1 (D141 fail-closed)"
              exit 1
            fi
          fi
          export GENAI_OVERRIDE_BASELINE="$base"
          python scripts/parse_existing.py
          python scripts/merge_and_dedupe.py

      - name: Validate incidents.json against schema
        run: python scripts/validate.py

      # v2.13.0 item 2: no AML.* id in the corpus or mappings/ may be absent
      # from, or deprecated in, the pinned ATLAS release; the pin must also
      # match the committed snapshot (ingest/atlas/) it is derived from.
      - name: Lint ATLAS ids against the pinned release
        run: python scripts/lint_atlas_ids.py

      - name: Re-render INCIDENTS.md + doc stats and ensure no drift
        run: |
          python scripts/render_markdown.py
          python scripts/render_docs_stats.py
          paths="INCIDENTS.md data/incidents.json data/incidents.min.json data/id_deprecations.json data/stats.json docs/incidents docs/data docs/charts src/genai_incidents/data src/genai_incidents/schema README.md docs/DATASHEET.md docs/index.html docs/_config.yml CITATION.cff"
          if [ -n "$(git status --porcelain $paths)" ]; then
            echo "::error::Generated files are out of date. Run 'make build' locally and commit the result."
            git status --porcelain $paths
            echo "::group::Drifted file diff (first 200 lines)"
            for f in $(git status --porcelain $paths | awk '{print $2}'); do
              echo "--- diff for $f ---"
              git --no-pager diff -- "$f" | head -80
            done
            echo "::endgroup::"
            exit 1
          fi

      - name: Check doc surfaces for hardcoded counts (invariant 6)
        run: python scripts/check_stats_drift.py

      - name: Scan rendered shards for raw HTML (stored-XSS guard)
        run: |
          # Incident free-text is HTML-escaped before going into the shards
          # (scripts/render_markdown.py: md_safe_text). The only raw tags that
          # should appear are the controlled <div class="incident-anchor"> /
          # </div> wrappers. Any other raw <tag> means an un-escaped field is
          # leaking HTML into the page — a stored-XSS regression. Fail loudly.
          leaked=$(grep -rhoE '<[/]?[a-zA-Z][a-zA-Z0-9]*' docs/incidents/ \
            | grep -viE '^<[/]?div$' | sort | uniq -c | sort -rn || true)
          if [ -n "$leaked" ]; then
            echo "::error::Raw HTML tags found in rendered shards (stored-XSS risk). Route the offending field through md_safe_text()/safe_url()."
            echo "$leaked"
            exit 1
          fi
          echo "shards clean: no raw HTML tags beyond the incident-anchor wrappers."

      - name: Build pip package (smoke)
        run: |
          pip install --quiet --upgrade build
          python -m build --wheel
